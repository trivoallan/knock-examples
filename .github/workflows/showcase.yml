name: showcase

# Runs the REAL example policies from the knock repository — checked out at the
# pinned tag, never copied here — and publishes the results to GHCR, so anyone
# can verify knock's provenance stamp without a clone or a cluster.
#
# Proven first against a throwaway namespace — the rebuild path (buildkitd plus
# credential propagation) is the least-charted part of this design — then switched
# to the public namespace and a weekly schedule.

on:
  schedule:
    - cron: "17 4 * * 1"     # Mondays, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write        # the OIDC token cosign exchanges with Fulcio

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Empty: publish straight under the owner. The policies already declare
      # `project: demo`, so a "demo" namespace here would yield the doubled
      # ghcr.io/<owner>/demo/demo/debian. The canary sets this to `canary`.
      NAMESPACE: ""
    steps:
      - uses: actions/checkout@v5

      - name: Start buildkitd
        # Not a service container: buildkitd listens on a unix socket unless told
        # otherwise, and a service container has no way to pass `--addr`. Started
        # here so the flag can be given, then waited for — buildctl's failure mode
        # against a not-yet-listening daemon is an opaque "error reading server
        # preface: connection reset by peer".
        run: |
          docker run -d --name buildkitd --privileged -p 1234:1234 \
            moby/buildkit:v0.18.2 --addr tcp://0.0.0.0:1234
          # Probe the port directly with bash's /dev/tcp. Probing with a buildctl
          # container is a trap: moby/buildkit's ENTRYPOINT is buildkitd, so
          # `docker run moby/buildkit buildctl ...` starts a second daemon that
          # never exits and the wait loop hangs instead of polling.
          for _ in $(seq 30); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/1234' 2>/dev/null; then
              echo "buildkitd is listening"
              exit 0
            fi
            sleep 2
          done
          echo "buildkitd never came up" >&2
          docker logs buildkitd >&2
          exit 1

      - name: Load the pin
        # $GITHUB_ENV parses KEY=VALUE only, and knock.env is mostly comments.
        run: grep -E '^[A-Z_]+=' knock.env >> "$GITHUB_ENV"

      - name: Check out the example policies at the pinned ref
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/knock
          ref: v${{ env.KNOCK_VERSION }}
          path: knock

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        # Both policies source docker.io, and anonymous pulls from the shared
        # GitHub runner IPs are throttled hard — without this the showcase is red
        # intermittently for a reason that has nothing to do with knock.
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # No KNOCK_ATTEST_FULCIO_URL / _REKOR_URL here, deliberately. They used to be
      # set explicitly to work around knock #252, where a blank value emitted no
      # caUrls and cosign v3 refused to sign. Since 0.9.3 a blank value resolves to
      # the public Sigstore instance for the keyless signer, and this run is the
      # proof of that in real conditions rather than in a unit test.
      - name: Reconcile the example policies
        # `reconcile` takes one directory, and the parent also holds debian-xz,
        # which sources a fixture seeded into an in-cluster registry and is out of
        # scope here — hence two invocations rather than one recursive walk.
        #
        # The docker config mount is load-bearing on BOTH paths: regctl reads it to
        # authenticate to GHCR, and BuildKit pushes on its own behalf using the same
        # client credentials. It must land on /tmp/.docker, not /root/.docker — the
        # runtime image runs as UID 65532 with HOME=/tmp (hardened for a read-only
        # root filesystem), so /root is not where anything looks.
        run: |
          set -euo pipefail
          for policy in busybox debian-tz; do
            echo "== reconciling $policy =="
            docker run --rm \
              -v "$PWD/knock:/knock:ro" \
              -v "$HOME/.docker:/tmp/.docker:ro" \
              --network host \
              -e BUILDKIT_HOST=tcp://127.0.0.1:1234 \
              -e KNOCK_REGISTRIES="$(jq -nc \
                   --arg h "ghcr.io/${{ github.repository_owner }}${NAMESPACE:+/$NAMESPACE}" \
                   --arg u "${{ github.actor }}" \
                   --arg p "${{ secrets.GITHUB_TOKEN }}" \
                   '{ghcr: {host: $h, username: $u, password: $p}}')" \
              -e KNOCK_SBOM_FORMATS='["spdx-json","cyclonedx-json"]' \
              -e KNOCK_ATTEST_SIGNER=keyless \
              # Text, not JSON: the only reader of these lines is a human scrolling the
              # Actions log. Nothing here parses knock's output — verify.sh reads regctl,
              # not this — so the structured form bought nothing and cost legibility.
              -e KNOCK_LOG_FORMAT=text \
              -e ACTIONS_ID_TOKEN_REQUEST_URL \
              -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
              "ghcr.io/${{ github.repository_owner }}/knock:${KNOCK_VERSION}" \
              reconcile "/knock/docs/examples/reference/$policy"
          done

      - name: Push the bypass image (never through the front door)
        run: |
          ref="ghcr.io/${{ github.repository_owner }}${NAMESPACE:+/$NAMESPACE}/bypass/busybox:1.37.0"
          docker build -t "$ref" bypass/
          docker push "$ref"

      - name: Install regctl and cosign
        run: |
          curl -sSfL "https://github.com/regclient/regclient/releases/download/v0.11.5/regctl-linux-amd64" \
            -o /usr/local/bin/regctl && chmod +x /usr/local/bin/regctl
          curl -sSfL "https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64" \
            -o /usr/local/bin/cosign && chmod +x /usr/local/bin/cosign

      - name: Verify what was just published
        run: ./verify.sh "${{ github.repository_owner }}" "$NAMESPACE"
