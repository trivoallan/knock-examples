name: canary

# The same policies as the showcase, replayed against knock's `main` into a
# throwaway namespace nobody links to — so a regression shows up here before it
# shows up on the page a visitor reads.
#
# It publishes for real rather than running --dry-run: a dry run exercises neither
# the stamp, the SBOM nor the signature, which is too little to justify a second
# workflow. It informs; it never blocks.

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write        # the OIDC token cosign exchanges with Fulcio

jobs:
  canary:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      NAMESPACE: canary
    steps:
      - uses: actions/checkout@v5

      - name: Start buildkitd
        # Not a service container: buildkitd listens on a unix socket unless told
        # otherwise, and a service container has no way to pass `--addr`. Started
        # here so the flag can be given, then waited for — buildctl's failure mode
        # against a not-yet-listening daemon is an opaque "error reading server
        # preface: connection reset by peer".
        run: |
          docker run -d --name buildkitd --privileged -p 1234:1234 \
            moby/buildkit:v0.18.2 --addr tcp://0.0.0.0:1234
          # Probe the port directly with bash's /dev/tcp. Probing with a buildctl
          # container is a trap: moby/buildkit's ENTRYPOINT is buildkitd, so
          # `docker run moby/buildkit buildctl ...` starts a second daemon that
          # never exits and the wait loop hangs instead of polling.
          for _ in $(seq 30); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/1234' 2>/dev/null; then
              echo "buildkitd is listening"
              exit 0
            fi
            sleep 2
          done
          echo "buildkitd never came up" >&2
          docker logs buildkitd >&2
          exit 1

      - name: Check out knock at main
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/knock
          ref: main
          path: knock

      - name: Build knock from main
        # knock publishes its image only on release, so there is no :main tag to
        # pull — the whole point of this workflow is to run code that has no
        # release yet.
        run: docker build -t knock:canary knock/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        # Both policies source docker.io, and anonymous pulls from the shared
        # GitHub runner IPs are throttled hard — without this the showcase is red
        # intermittently for a reason that has nothing to do with knock.
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The two sigstore URLs are set explicitly rather than left blank. knock's
      # published reference says a blank KNOCK_ATTEST_FULCIO_URL means "public
      # Fulcio", but `build_signing_config` emits no caUrls at all when it is
      # blank, and cosign v3 then refuses: "no fulcio URLs provided in signing
      # config". Naming them is also the better choice for a public showcase — a
      # visitor can see exactly which trust roots produced the signature.
      - name: Reconcile the example policies
        # `reconcile` takes one directory, and the parent also holds debian-xz,
        # which sources a fixture seeded into an in-cluster registry and is out of
        # scope here — hence two invocations rather than one recursive walk.
        #
        # The docker config mount is load-bearing on BOTH paths: regctl reads it to
        # authenticate to GHCR, and BuildKit pushes on its own behalf using the same
        # client credentials. It must land on /tmp/.docker, not /root/.docker — the
        # runtime image runs as UID 65532 with HOME=/tmp (hardened for a read-only
        # root filesystem), so /root is not where anything looks.
        run: |
          set -euo pipefail
          for policy in busybox debian-tz; do
            echo "== reconciling $policy =="
            docker run --rm \
              -v "$PWD/knock:/knock:ro" \
              -v "$HOME/.docker:/tmp/.docker:ro" \
              --network host \
              -e BUILDKIT_HOST=tcp://127.0.0.1:1234 \
              -e KNOCK_REGISTRIES="$(jq -nc \
                   --arg h "ghcr.io/${{ github.repository_owner }}${NAMESPACE:+/$NAMESPACE}" \
                   --arg u "${{ github.actor }}" \
                   --arg p "${{ secrets.GITHUB_TOKEN }}" \
                   '{ghcr: {host: $h, username: $u, password: $p}}')" \
              -e KNOCK_SBOM_FORMATS='["spdx-json","cyclonedx-json"]' \
              -e KNOCK_ATTEST_SIGNER=keyless \
              -e KNOCK_ATTEST_FULCIO_URL=https://fulcio.sigstore.dev \
              -e KNOCK_ATTEST_REKOR_URL=https://rekor.sigstore.dev \
              # Text, not JSON: the only reader of these lines is a human scrolling the
              # Actions log. Nothing here parses knock's output — verify.sh reads regctl,
              # not this — so the structured form bought nothing and cost legibility.
              -e KNOCK_LOG_FORMAT=text \
              -e ACTIONS_ID_TOKEN_REQUEST_URL \
              -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
              knock:canary \
              reconcile "/knock/docs/examples/reference/$policy"
          done

      - name: Reconcile the skill policy (expected red until the verb lands)
        # The one place this can run at all. The showcase pins a released tag, so it
        # can never exercise unreleased work; this workflow builds from `main`, which
        # is exactly what the skill front door needs — no release carries it yet.
        #
        # Its own step, not the loop above: that loop hardcodes the
        # `docs/examples/reference/` prefix, and the skill example lives under
        # `docs/examples/skills/`.
        #
        # `continue-on-error` and the explicit exit-code read are the point of this
        # step, not a workaround. Today reconcile filters git-sourced policies out
        # before the plan phase and reports each `UnsupportedSourceError`, so exit 1
        # is the CORRECT answer and a green here would mean something had silently
        # started doing nothing. ADR 0048 lists "the reconcile merge" as deferred
        # work, so the day it lands this step turns 0 on its own and the message
        # below says so — that flip is the signal the canary exists to catch.
        continue-on-error: true
        run: |
          # GitHub Actions runs every `run:` block as `bash -e {0}`, so errexit is ON
          # before this script starts and omitting `set -e` does not disable it.
          # `set +e` is what actually turns it off, and it has to be here: the whole
          # point of this step is that a non-zero exit is the RESULT, not a failure.
          set -uo pipefail
          set +e
          dir=knock/docs/examples/skills
          if [ ! -d "$dir" ]; then
            echo "no skill example at $dir on this checkout — nothing to reconcile"
            exit 0
          fi
          docker run --rm \
            -v "$PWD/knock:/knock:ro" \
            -v "$HOME/.docker:/tmp/.docker:ro" \
            --network host \
            -e KNOCK_REGISTRIES="$(jq -nc \
                 --arg h "ghcr.io/${{ github.repository_owner }}${NAMESPACE:+/$NAMESPACE}" \
                 --arg u "${{ github.actor }}" \
                 --arg p "${{ secrets.GITHUB_TOKEN }}" \
                 '{ghcr: {host: $h, username: $u, password: $p}}')" \
            -e KNOCK_LOG_FORMAT=text \
            knock:canary \
            reconcile /knock/docs/examples/skills
          code=$?
          case "$code" in
            0) echo "::notice::the skill front door is live — reconcile handled a git-sourced policy" ;;
            1) echo "expected: reconcile reports git-sourced policies as failed (ADR 0048)" ;;
            *) echo "::warning::unexpected exit $code — not the UnsupportedSourceError this expects" ;;
          esac

      - name: Push the bypass image (never through the front door)
        run: |
          ref="ghcr.io/${{ github.repository_owner }}${NAMESPACE:+/$NAMESPACE}/bypass/busybox:1.37.0"
          docker build -t "$ref" bypass/
          docker push "$ref"

      # No verify.sh here: it pins the identity to a `knock-examples` workflow and
      # the assertion would pass for the canary too, but the signal this workflow
      # exists for is whether reconcile succeeds against unreleased code at all.
